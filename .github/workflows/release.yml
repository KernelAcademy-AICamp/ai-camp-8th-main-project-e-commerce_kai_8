name: Release

# 수동 릴리즈: Actions 탭에서 "Run workflow"로 실행. (ecommerce repo의 release.yml 이식)
# develop의 Conventional Commits로 버전 산정 → CHANGELOG·태그·GitHub Release
# → develop를 main으로 승격(merge) → Vercel Git 연동이 main push를 받아 프로덕션 자동 배포.
# 릴리즈 봇의 main 직접 push는 AGENTS.md "main 직접 push 금지" 규칙의 명시적 예외다.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "버전 증가 방식 (auto = 커밋으로 자동 판단)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Compute next version
        id: ver
        run: |
          cd frontend
          CURRENT=$(node -p "require('./package.json').version")
          TYPE="${{ inputs.release_type }}"
          if [ "$TYPE" = "auto" ]; then
            TYPE=$(npx -y conventional-recommended-bump -p conventionalcommits 2>/dev/null || echo patch)
          fi
          NEXT=$(npx -y semver -i "$TYPE" "$CURRENT")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "릴리즈: $CURRENT -> $NEXT ($TYPE)"
      - name: Bump version + update changelog
        run: |
          cd frontend
          npm pkg set version="${{ steps.ver.outputs.next }}"
          npx -y conventional-changelog-cli -p conventionalcommits -i CHANGELOG.md -s
          # 생성된 CHANGELOG가 CI의 prettier --check에 걸리지 않게 즉시 포맷한다
          npx -y prettier --write CHANGELOG.md
      - name: Commit, tag, push to develop
        run: |
          git add frontend/package.json frontend/CHANGELOG.md
          git commit -m "chore(release): ${{ steps.ver.outputs.tag }}"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "release ${{ steps.ver.outputs.tag }}"
          git push origin develop
          git push origin "${{ steps.ver.outputs.tag }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "변경점: frontend/CHANGELOG.md 참고"
      - name: Promote develop to main (merge → Vercel 프로덕션 배포)
        run: |
          git fetch origin main
          git checkout main
          # main은 develop의 배포 스냅샷이다. 일반 merge는 main에 squash로 얹힌
          # 과거 승격 커밋과 3-way 충돌을 일으킬 수 있어(v0.1.1 릴리즈 실패 사례),
          # 머지 부모(main, develop)는 남기되 트리는 develop을 그대로 사용해
          # 충돌을 원천 차단한다.
          git merge --no-ff -s ours --no-commit develop
          git read-tree -u --reset develop
          git commit -m "chore: release 승격 ${{ steps.ver.outputs.tag }}"
          git push origin main
