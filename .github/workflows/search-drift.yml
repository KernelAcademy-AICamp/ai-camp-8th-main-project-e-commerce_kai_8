# 검색 낡음 감시 — 운영 카탈로그를 상대로 하루 1회 돌린다.
#
# **왜 PR 게이트가 아닌가.** 이 파일이 잡는 실패의 상당수는 PR과 무관한 **운영 데이터
# 낡음**이다(재수집 뒤 파생 표를 다시 안 만들면 아무도 코드를 안 고쳐도 깨진다).
# PR 게이트는 그것을 못 잡고, 고정 픽스처는 픽스처 자체가 낡아 낡음 감시를 무력화한다 —
# 감시 장치가 대상을 안 보는 그 실패의 재현이다.
# 근거: docs/plans/2026-08-22-search-test-drift-fix.md 3단계.
#
# ⚠️ **시크릿 `SUPABASE_DB_URL`이 있어야 실제로 돈다.** 없으면 초록불로 건너뛰되,
#    건너뛴 사실을 경고와 요약으로 **크게** 남긴다 — 조용한 초록불이 이 문서 전체의
#    주제인 실패 유형이기 때문이다.
#
# ⚠️ 예약 실행은 **기본 브랜치(main)에서만** 돈다. 릴리즈로 main에 올라가기 전에는
#    예약이 시작되지 않는다. 그 전까지는 아래 수동 실행을 쓴다.
# ⚠️ GitHub은 repo가 60일 잠잠하면 예약 워크플로를 자동 비활성화한다.
name: Search drift watch

on:
  schedule:
    # 06:00 KST (21:00 UTC) — 사람이 출근해서 볼 수 있는 시각에 결과가 있도록
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: search-drift
  cancel-in-progress: false

jobs:
  search-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      # 시크릿을 셸로 보간하지 않는다 — env로만 넘기고 존재 여부만 본다.
      - id: dsn
        name: 접속 문자열이 있나
        env:
          SEARCH_TEST_DSN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SEARCH_TEST_DSN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL 시크릿이 없어 검색 낡음 감시를 건너뛴다 — 이 워크플로는 지금 아무것도 검증하지 않는다."
            {
              echo "## ⚠️ 건너뜀 — 아무것도 검증하지 않았다"
              echo
              echo "\`SUPABASE_DB_URL\` 시크릿이 이 repo에 없다. 넣기 전까지 이 초록불은 **통과가 아니라 미실행**이다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 검색 낡음 감시 실행
        if: steps.dsn.outputs.have == 'true'
        env:
          SEARCH_TEST_DSN: ${{ secrets.SUPABASE_DB_URL }}
        run: pytest tests/test_search_fallback.py -v --junit-xml=result.xml

      # ⚠️ **초록불이 대상을 봤는지 확인한다.** 이 repo에서 "통과했다"는 신호가 대상을
      # 포함하지 않은 실패가 다섯 번 반복됐다(2026-08-22-search-test-drift.md "배운 것").
      # DSN이 있는데도 전부 skip으로 지나가면 그것은 통과가 아니다.
      - name: 실제로 돈 것이 있나
        if: steps.dsn.outputs.have == 'true'
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          s = ET.parse("result.xml").getroot().find("testsuite")
          total, skipped = int(s.get("tests")), int(s.get("skipped"))
          ran = total - skipped
          print(f"수집 {total}건 · skip {skipped}건 · 실제로 돈 것 {ran}건")
          if ran == 0:
              sys.exit("접속 문자열이 있는데 한 건도 돌지 않았다 — 초록불이 대상을 안 봤다")
          PY

      - name: 실패를 Slack으로 알린다
        if: failure() && steps.dsn.outputs.have == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          MSG="🔴 검색 낡음 감시 실패 — 운영 카탈로그와 검색이 어긋났다\n<${RUN}|실행 로그 열기>"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$MSG" '{text:$t}')" \
            "$SLACK_WEBHOOK_URL"
