<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>그래픽 티 발견 검색 — Clean 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #0e0f12;
    --text: #f5f5f4;
    --muted: rgba(245, 245, 244, 0.5);
    --hairline: rgba(255, 255, 255, 0.14);
    --glass: rgba(255, 255, 255, 0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    background: radial-gradient(80rem 50rem at 50% -20%, #1a1c22, var(--bg) 60%);
    color: var(--text);
    min-height: 100dvh;
    overflow: hidden;
  }

  /* ---------- 네비 ---------- */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.75rem clamp(1.5rem, 4vw, 3rem);
  }
  .nav__brand {
    text-decoration: none; color: var(--text);
    font-size: 0.95rem; font-weight: 800; letter-spacing: -0.02em;
  }
  .nav__links { display: flex; gap: 1.75rem; }
  .nav__links a {
    color: var(--muted); text-decoration: none;
    font-size: 0.85rem; font-weight: 500;
    transition: color 0.2s;
  }
  .nav__links a:hover, .nav__links a:focus-visible { color: var(--text); }

  /* ---------- 히어로 ---------- */
  .hero {
    min-height: calc(100dvh - 6rem);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2.5rem;
    padding: 0 1.5rem 14rem; text-align: center;
  }

  .hero__title {
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.25;
  }
  .hero__title span { color: var(--muted); }

  /* ---------- 검색 필 ---------- */
  .search { width: min(36rem, 92vw); }
  .search__pill {
    display: flex; align-items: center;
    height: 4rem; border-radius: 999px; padding: 0.45rem 0.45rem 0.45rem 1.6rem;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--hairline);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 16px 48px rgba(0, 0, 0, 0.4);
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .search__pill:focus-within {
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 4px rgba(255, 255, 255, 0.06), 0 16px 48px rgba(0, 0, 0, 0.45);
  }
  .search__input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    color: var(--text);
    font: 500 1rem/1 "Pretendard Variable", Pretendard, sans-serif;
  }
  .search__input::placeholder { color: var(--muted); }
  .search__btn {
    flex: none; height: 3.1rem; padding: 0 1.7rem; border: 0; border-radius: 999px;
    background: #fff; color: #101013;
    font: 700 0.92rem "Pretendard Variable", Pretendard, sans-serif;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  .search__btn:hover, .search__btn:focus-visible { transform: translateY(-1px); }
  .search__btn:active { transform: translateY(0); opacity: 0.9; }

  /* ---------- 예시 칩 ---------- */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
  .chip {
    border-radius: 999px; padding: 0.55rem 1.1rem; cursor: pointer;
    background: none; border: 1px solid var(--hairline);
    color: var(--muted);
    font: 500 0.82rem "Pretendard Variable", Pretendard, sans-serif;
    transition: color 0.2s, border-color 0.2s;
  }
  .chip:hover, .chip:focus-visible { color: var(--text); border-color: rgba(255, 255, 255, 0.35); }

  /* ---------- 하단 상품 스트립 ---------- */
  .strip {
    position: fixed; left: 0; right: 0; bottom: 2.5rem;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .strip__track {
    display: flex; gap: 1rem; width: max-content;
    animation: slide 60s linear infinite;
  }
  @keyframes slide { to { transform: translateX(-50%); } }
  .strip img {
    width: 8.5rem; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: 12px;
    filter: saturate(0.9) brightness(0.85);
    transition: filter 0.25s, transform 0.25s;
  }
  .strip img:hover { filter: none; transform: translateY(-4px); }

  /* ---------- 로드 시퀀스 ---------- */
  .hero > *, .strip { opacity: 0; translate: 0 12px; animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
  .hero > :nth-child(1) { animation-delay: 0.05s; }
  .hero > :nth-child(2) { animation-delay: 0.18s; }
  .hero > :nth-child(3) { animation-delay: 0.3s; }
  .strip { animation-name: rise, none; animation-delay: 0.45s; }
  @keyframes rise { to { opacity: 1; translate: 0 0; } }

  @media (prefers-reduced-motion: reduce) {
    .hero > *, .strip, .strip__track { animation: none; opacity: 1; translate: 0 0; }
  }

  @media (max-width: 40rem) {
    .nav__links { display: none; }
    .hero { padding-bottom: 12rem; }
    .strip img { width: 7rem; }
  }
</style>
</head>
<body>

<header class="nav">
  <a class="nav__brand" href="#">티:파운드</a>
  <nav class="nav__links" aria-label="주요 메뉴">
    <a href="#">검색</a>
    <a href="#">브랜드</a>
    <a href="#">소개</a>
  </nav>
</header>

<main class="hero">
  <h1 class="hero__title">입고 싶은 티셔츠,<br /><span>문장으로 검색하세요</span></h1>

  <form class="search" role="search" onsubmit="return false">
    <div class="search__pill">
      <input class="search__input" type="search" aria-label="티셔츠 검색"
             placeholder="검정 바탕에 흰 레터링 백프린트" />
      <button class="search__btn" type="submit">검색</button>
    </div>
  </form>

  <div class="chips">
    <button class="chip" type="button">검정 바탕에 흰 레터링</button>
    <button class="chip" type="button">네이비 저지, 가슴 로고</button>
    <button class="chip" type="button">아이보리, 아치 스크립트</button>
  </div>
</main>

<!-- DB(search_goods) 실제 상품 — 하단 스트립 -->
<div class="strip" aria-hidden="true">
  <div class="strip__track"></div>
</div>

<script>
  const goods = [
    "https://image.msscdn.net/images/goods_img/20211110/2225772/2225772_17416566557348_500.jpg",
    "https://image.msscdn.net/images/goods_img/20230829/3509806/3509806_16932933104825_500.png",
    "https://image.msscdn.net/images/goods_img/20230406/3213283/3213283_17435573335224_500.jpg",
    "https://image.msscdn.net/images/goods_img/20240207/3852522/3852522_17398365622718_500.jpg",
    "https://image.msscdn.net/images/goods_img/20240805/4296100/4296100_17236147415206_500.jpg",
    "https://image.msscdn.net/images/goods_img/20250420/5045549/5045549_17459121536079_500.jpg",
    "https://image.msscdn.net/images/goods_img/20231016/3629645/3629645_17847033561665_500.jpg",
    "https://image.msscdn.net/images/goods_img/20240428/4092313/4092313_17642081736097_500.jpg",
    "https://image.msscdn.net/images/goods_img/20230317/3156109/3156109_17331260267192_500.jpg",
    "https://image.msscdn.net/images/goods_img/20240327/3997076/3997076_17827212879793_500.jpg",
    "https://image.msscdn.net/images/goods_img/20250204/4754406/4754406_17636949283847_500.jpg",
    "https://image.msscdn.net/images/goods_img/20240408/4034896/4034896_17128012196414_500.jpg",
  ];

  // 끊김 없는 루프: 두 번 이어 붙이고 -50% 이동
  const track = document.querySelector(".strip__track");
  [...goods, ...goods].forEach((src) => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "";
    track.appendChild(img);
  });

  // 플레이스홀더 타이핑 데모
  const queries = [
    "검정 바탕에 흰 레터링 백프린트",
    "네이비 저지, 가슴에 로고",
    "아이보리 티에 아치 스크립트",
  ];
  const input = document.querySelector(".search__input");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduced) {
    let qi = 0, ci = 0, erasing = false;
    setInterval(() => {
      if (document.activeElement === input) return;
      const q = queries[qi];
      if (!erasing) {
        ci++;
        if (ci >= q.length + 16) erasing = true;
      } else {
        ci--;
        if (ci <= 0) { erasing = false; qi = (qi + 1) % queries.length; }
      }
      input.placeholder = q.slice(0, Math.min(ci, q.length));
    }, 65);
  }

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      input.value = chip.textContent.trim();
      input.focus();
    });
  });
</script>
</body>
</html>
