<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>그래픽 티 발견 검색 — 검색 결과 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #0b0d10;
    --text: #f5f5f4;
    --muted: rgba(245, 245, 244, 0.55);
    --hairline: rgba(255, 255, 255, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    background:
      radial-gradient(50rem 34rem at 12% -6%, rgba(53, 110, 255, 0.45), transparent 62%),
      radial-gradient(44rem 30rem at 105% 22%, rgba(148, 70, 245, 0.38), transparent 62%),
      radial-gradient(40rem 28rem at 88% 108%, rgba(255, 110, 45, 0.32), transparent 62%),
      radial-gradient(36rem 26rem at -4% 90%, rgba(40, 200, 145, 0.26), transparent 62%),
      #0d0f13;
    background-attachment: fixed;
    color: var(--text);
    min-height: 100dvh;
  }

  /* ---------- 헤더 (워터드롭 검색창 축소형) ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 2rem;
    padding: 2.75rem clamp(1.5rem, 4vw, 3rem) 1.2rem;
    background: rgba(11, 13, 16, 0.72);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  .top__brand {
    text-decoration: none; color: var(--text);
    font-size: 0.95rem; font-weight: 800; letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .search { flex: 1; max-width: 44rem; }
  .search__pill {
    position: relative;
    display: flex; align-items: center;
    height: 3.9rem; border-radius: 999px; padding: 0.45rem 0.45rem 0.45rem 1.6rem;
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(7px) saturate(1.25);
    backdrop-filter: blur(7px) saturate(1.25);
    box-shadow:
      inset 0 1.5px 1px rgba(255, 255, 255, 0.55),
      inset 0 -6px 10px -7px rgba(255, 255, 255, 0.4),
      inset 13px 0 16px -11px rgba(255, 255, 255, 0.45),
      inset -13px 0 16px -11px rgba(255, 255, 255, 0.45),
      inset 24px 0 28px -16px rgba(0, 0, 0, 0.5),
      inset -24px 0 28px -16px rgba(0, 0, 0, 0.5),
      0 14px 40px rgba(0, 0, 0, 0.45);
    transition: background 0.25s;
  }
  .search__pill:focus-within { background: rgba(255, 255, 255, 0.08); }
  .search__input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    color: var(--text);
    font: 500 1rem/1 "Pretendard Variable", Pretendard, sans-serif;
  }
  .search__btn {
    flex: none; width: 3rem; height: 3rem; border: 0; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.12);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.6),
      inset 8px 0 12px -8px rgba(255, 255, 255, 0.4),
      inset -8px 0 12px -8px rgba(255, 255, 255, 0.4);
    color: #fff; cursor: pointer;
    transition: background 0.2s;
  }
  .search__btn:hover, .search__btn:focus-visible { background: rgba(255, 255, 255, 0.2); }

  /* ---------- 파싱된 조건 토큰 ---------- */
  .parsed {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.55rem;
    padding: 0.9rem clamp(1.5rem, 4vw, 3rem) 0.4rem;
  }
  .token {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border-radius: 999px; padding: 0.5rem 1.05rem;
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.5),
      inset 8px 0 12px -8px rgba(255, 255, 255, 0.35),
      inset -8px 0 12px -8px rgba(255, 255, 255, 0.35),
      0 10px 26px rgba(0, 0, 0, 0.35);
    font-size: 0.82rem; font-weight: 600;
    opacity: 0; transform: scale(0.25);
    animation: droplet 0.6s cubic-bezier(0.3, 1.65, 0.4, 1) forwards;
  }
  .token:nth-child(2) { animation-delay: 0.09s; }
  .token:nth-child(3) { animation-delay: 0.18s; }
  .token i { font-style: normal; font-weight: 500; font-size: 0.74rem; color: var(--muted); }
  .token .swatch {
    width: 0.85rem; height: 0.85rem; border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  .parsed__count {
    margin-left: 0.4rem;
    font-size: 0.8rem; color: var(--muted);
    opacity: 0; animation: fade 0.6s 0.4s forwards;
  }
  @keyframes droplet {
    0%   { opacity: 0; transform: scale(0.2); filter: blur(8px); }
    55%  { opacity: 1; transform: scale(1.1, 0.88); filter: blur(0); }
    75%  { transform: scale(0.95, 1.06); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- 결과 그리드 ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem 1.25rem;
    padding: 1.8rem clamp(1.5rem, 4vw, 3rem) 4rem;
  }
  .item {
    text-decoration: none; color: inherit;
    opacity: 0; translate: 0 14px;
    animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    animation-delay: calc(var(--i) * 0.05s + 0.15s);
  }
  @keyframes rise { to { opacity: 1; translate: 0 0; } }
  .item__frame {
    position: relative; overflow: hidden; border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .item__frame img {
    width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block;
    filter: brightness(0.92);
    transition: filter 0.25s, transform 0.4s;
  }
  .item:hover .item__frame, .item:focus-visible .item__frame {
    transform: translateY(-4px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2), 0 18px 44px rgba(0, 0, 0, 0.45);
  }
  .item:hover img, .item:focus-visible img { filter: brightness(1); transform: scale(1.03); }
  /* 호버 시 일치 배지가 물방울로 맺힘 */
  .item__match {
    position: absolute; left: 0.7rem; bottom: 0.7rem;
    border-radius: 999px; padding: 0.4rem 0.85rem;
    background: rgba(15, 17, 21, 0.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
    font-size: 0.72rem; font-weight: 600; color: rgba(245, 245, 244, 0.9);
    opacity: 0; transform: scale(0.4);
    transition: opacity 0.2s, transform 0.3s cubic-bezier(0.3, 1.65, 0.4, 1);
    pointer-events: none;
  }
  .item:hover .item__match, .item:focus-visible .item__match { opacity: 1; transform: scale(1); }
  .item__meta { padding: 0.7rem 0.2rem 0; }
  .item__brand { font-size: 0.74rem; color: var(--muted); }
  .item__title {
    margin-top: 0.15rem;
    font-size: 0.88rem; font-weight: 500; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item__price { margin-top: 0.3rem; font-size: 0.92rem; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .token, .item, .parsed__count { animation: none; opacity: 1; transform: none; translate: 0 0; }
    .item__match { transition: none; }
  }

  @media (max-width: 64rem) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 46rem) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 1.25rem 0.9rem; }
    .top { gap: 1rem; }
  }
</style>
</head>
<body>

<header class="top">
  <a class="top__brand" href="2026-08-04-home-final.html">티:파운드</a>
  <form class="search" role="search" onsubmit="return false">
    <div class="search__pill">
      <input class="search__input" type="search" aria-label="티셔츠 검색"
             value="검정 바탕에 흰 레터링 백프린트" />
      <button class="search__btn" type="submit" aria-label="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="1.8" />
          <path d="M15.8 15.8 L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </form>
</header>

<!-- LLM이 파싱한 조건 — 물방울 토큰으로 맺힘 -->
<section class="parsed" aria-label="해석된 검색 조건">
  <span class="token"><span class="swatch" style="background:#17181c"></span><i>바탕색</i>블랙</span>
  <span class="token"><span class="swatch" style="background:#f4f2ec"></span><i>프린트</i>화이트 레터링</span>
  <span class="token"><i>위치</i>백프린트</span>
  <span class="parsed__count">12개 발견</span>
</section>

<main class="grid" id="grid"></main>

<script>
  // DB(search_goods) 실측 — 블랙 × 로고/그래픽, 리뷰순
  const results = [
    { brand: "드릭스", title: "[SET-UP] 럭비 오버핏 메시 하프 셋업_3color", price: 49600, img: "https://image.msscdn.net/images/goods_img/20250616/5187827/5187827_17504003447171_500.jpg" },
    { brand: "드릭스", title: "럭비 오버핏 메시 저지 하프 슬리브_블랙", price: 22990, img: "https://image.msscdn.net/images/goods_img/20250420/5045551/5045551_17459121286173_500.jpg" },
    { brand: "에이치덱스", title: "메인 백로고 오버핏 반팔티", price: 48000, img: "https://image.msscdn.net/images/goods_img/20220526/2584839/2584839_17790681796826_500.jpg" },
    { brand: "클레버필드", title: "시그니처 엠블럼 크롭 티셔츠 [블랙]", price: 22820, img: "https://image.msscdn.net/images/goods_img/20230207/3064786/3064786_16784413180227_500.jpg" },
    { brand: "바이젝", title: "퍼펙트 특양면 빅로고 오버핏 반팔 티셔츠_2Color", price: 36000, img: "https://image.msscdn.net/images/goods_img/20231016/3629645/3629645_17847033561665_500.jpg" },
    { brand: "드릭스", title: "머슬핏 트랙 라인 링거 하프 슬리브_5color", price: 29900, img: "https://image.msscdn.net/images/goods_img/20250526/5147122/5147122_17490902706784_500.jpg" },
    { brand: "카키그라도", title: "리프팅클럽 머슬드 레귤러핏 반팔 티셔츠", price: 37000, img: "https://image.msscdn.net/images/goods_img/20230821/3481806/3481806_17826946611470_500.jpg" },
    { brand: "제이엘브", title: "아치로고 헤비 루즈핏 숏슬리브", price: 32000, img: "https://image.msscdn.net/images/goods_img/20240408/4034896/4034896_17128012196414_500.jpg" },
    { brand: "드릭스", title: "머슬 챔피언 그래픽 하프 슬리브_블랙", price: 21250, img: "https://image.msscdn.net/images/goods_img/20250312/4888687/4888687_17422799798722_500.jpg" },
    { brand: "제이엘브", title: "짐클럽 오버핏 숏슬리브", price: 31500, img: "https://image.msscdn.net/images/goods_img/20250219/4804958/4804958_17406364573171_500.jpg" },
    { brand: "바이젝", title: "퍼펙트 특양면 빅로고 머슬핏 반팔 티셔츠_2Color", price: 34200, img: "https://image.msscdn.net/images/goods_img/20231016/3629624/3629624_17743292210401_500.jpg" },
    { brand: "플래니트", title: "ICE LITE 초냉감 오버핏 티셔츠", price: 33160, img: "https://image.msscdn.net/images/goods_img/20230508/3280136/3280136_17437246367322_500.jpg" },
  ];

  const grid = document.getElementById("grid");
  results.forEach((r, i) => {
    const a = document.createElement("a");
    a.className = "item";
    a.href = "#";
    a.style.setProperty("--i", i);
    a.innerHTML = `
      <div class="item__frame">
        <img src="${r.img}" alt="${r.brand} ${r.title}" loading="lazy" />
        <span class="item__match">바탕 · 프린트 · 위치 일치</span>
      </div>
      <div class="item__meta">
        <div class="item__brand">${r.brand}</div>
        <div class="item__title">${r.title}</div>
        <div class="item__price">${r.price.toLocaleString()}원</div>
      </div>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
