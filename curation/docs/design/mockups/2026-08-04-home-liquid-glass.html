<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>그래픽 티 발견 검색 — Liquid Glass 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --sky: #79c4ee;
    --deep-sky: #4fa6dd;
    --tangerine: #f4692e;
    --butter: #ffd866;
    --ink: #0e2a3c;
    --glass: rgba(255, 255, 255, 0.14);
    --glass-strong: rgba(255, 255, 255, 0.28);
    --glass-edge: rgba(255, 255, 255, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    color: #fff;
    min-height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(90rem 60rem at 110% 110%, rgba(244, 105, 46, 0.55), transparent 55%),
      radial-gradient(70rem 50rem at -10% -20%, rgba(255, 216, 102, 0.5), transparent 50%),
      linear-gradient(180deg, var(--sky) 0%, var(--deep-sky) 100%);
  }

  /* ---------- 떠다니는 그래픽 티 ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; }

  .tee {
    position: absolute;
    filter: drop-shadow(0 18px 30px rgba(14, 42, 60, 0.18));
    animation: drift 14s ease-in-out infinite alternate;
  }
  .tee svg { display: block; width: 100%; height: auto; }
  .tee--1 { width: 15rem; left: 6%;  top: 14%; rotate: -9deg;  animation-delay: 0s; }
  .tee--2 { width: 12rem; right: 9%; top: 10%; rotate: 8deg;   animation-delay: -4s; }
  .tee--3 { width: 13rem; left: 14%; bottom: 6%; rotate: 6deg; animation-delay: -8s; }
  .tee--4 { width: 17rem; right: 13%; bottom: 2%; rotate: -7deg; animation-delay: -2s; filter: blur(2px) drop-shadow(0 18px 30px rgba(14,42,60,.14)); }
  .tee--5 { width: 9rem; left: 30%; top: 4%; rotate: 3deg; animation-delay: -11s; filter: blur(3px); opacity: .85; }

  @keyframes drift {
    from { transform: translateY(-14px); }
    to   { transform: translateY(16px); }
  }

  /* ---------- 유리 공통 ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.7);
    backdrop-filter: blur(18px) saturate(1.7);
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow:
      inset 0 1px 0 var(--glass-edge),
      inset 0 -1px 0 rgba(255, 255, 255, 0.12),
      0 12px 40px rgba(14, 42, 60, 0.16);
  }

  /* ---------- 상단 네비 ---------- */
  .nav {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.5rem clamp(1.25rem, 4vw, 3rem);
  }
  .nav__brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; }
  .nav__chip {
    width: 2.75rem; height: 2.75rem; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.25rem;
  }
  .nav__title { font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em; text-shadow: 0 1px 6px rgba(14,42,60,.25); }
  .nav__links { display: flex; gap: 0.25rem; border-radius: 999px; padding: 0.3rem; }
  .nav__links a {
    color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 600;
    padding: 0.5rem 1rem; border-radius: 999px; transition: background 0.2s;
  }
  .nav__links a:hover, .nav__links a:focus-visible { background: rgba(255, 255, 255, 0.22); }

  /* ---------- 히어로 ---------- */
  .hero {
    position: relative; z-index: 2;
    min-height: calc(100dvh - 6rem);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2rem; padding: 0 1.25rem 4rem; text-align: center;
  }

  .hero__eyebrow {
    font-family: "Space Grotesk", sans-serif;
    font-size: 0.8rem; letter-spacing: 0.35em; font-weight: 500;
    text-transform: uppercase; opacity: 0.9;
  }

  .hero__title {
    font-family: "Gasoek One", sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 7vw, 5rem);
    line-height: 1.12;
    text-shadow: 0 2px 24px rgba(14, 42, 60, 0.25);
  }
  .hero__title em {
    font-style: normal; color: var(--butter);
    text-shadow: 0 2px 24px rgba(244, 105, 46, 0.45);
  }

  /* ---------- 검색 필 ---------- */
  .search {
    display: flex; align-items: center; gap: 0.9rem;
    width: min(42rem, 92vw);
  }
  .search__chip {
    flex: none; width: 4.5rem; height: 4.5rem; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.8rem;
  }
  .search__pill {
    display: flex; align-items: center; flex: 1;
    height: 4.5rem; border-radius: 999px; padding: 0.5rem 0.5rem 0.5rem 1.75rem;
    transition: box-shadow 0.25s, background 0.25s;
  }
  .search__pill:focus-within {
    background: var(--glass-strong);
    box-shadow:
      inset 0 1px 0 var(--glass-edge),
      0 0 0 3px rgba(255, 255, 255, 0.45),
      0 16px 48px rgba(14, 42, 60, 0.22);
  }
  .search__input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    color: #fff; font: 600 1.05rem/1 "Pretendard Variable", Pretendard, sans-serif;
    letter-spacing: -0.01em;
  }
  .search__input::placeholder { color: rgba(255, 255, 255, 0.8); }
  .search__btn {
    flex: none; height: 3.5rem; padding: 0 1.6rem; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ff8a50, var(--tangerine));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 8px 20px rgba(244, 105, 46, 0.4);
    color: #fff; font: 700 1rem "Pretendard Variable", Pretendard, sans-serif;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  .search__btn:hover, .search__btn:focus-visible { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 12px 26px rgba(244, 105, 46, 0.5); }
  .search__btn:active { transform: translateY(0); }

  /* ---------- 예시 칩 ---------- */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; max-width: 40rem; }
  .chip {
    border-radius: 999px; padding: 0.6rem 1.15rem; cursor: pointer;
    color: #fff; font: 600 0.85rem "Pretendard Variable", Pretendard, sans-serif;
    transition: transform 0.15s, background 0.2s;
  }
  .chip:hover, .chip:focus-visible { transform: translateY(-2px); background: var(--glass-strong); }
  .chip b { color: var(--butter); font-weight: 700; }

  /* ---------- 하단 공식 ---------- */
  .formula {
    display: flex; align-items: center; gap: 0.75rem;
    font-family: "Space Grotesk", "Pretendard Variable", sans-serif;
    font-size: 0.8rem; letter-spacing: 0.12em; opacity: 0.92;
  }
  .formula span { border-radius: 999px; padding: 0.45rem 0.95rem; }
  .formula i { font-style: normal; opacity: 0.7; }

  /* ---------- 로드 시퀀스 ---------- */
  .hero > * { opacity: 0; translate: 0 14px; animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
  .hero > :nth-child(1) { animation-delay: 0.05s; }
  .hero > :nth-child(2) { animation-delay: 0.15s; }
  .hero > :nth-child(3) { animation-delay: 0.3s; }
  .hero > :nth-child(4) { animation-delay: 0.45s; }
  .hero > :nth-child(5) { animation-delay: 0.6s; }
  @keyframes rise { to { opacity: 1; translate: 0 0; } }

  @media (prefers-reduced-motion: reduce) {
    .tee, .hero > * { animation: none; opacity: 1; translate: 0 0; }
  }

  @media (max-width: 40rem) {
    .nav__links { display: none; }
    .search { flex-direction: column; }
    .search__chip { display: none; }
    .search__pill { width: 100%; }
    .formula { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

<!-- 떠다니는 그래픽 티 배경 -->
<div class="sky" aria-hidden="true">
  <div class="tee tee--1">
    <svg viewBox="0 0 120 140">
      <path d="M38 2 L20 10 L2 38 L24 52 L24 136 L96 136 L96 52 L118 38 L100 10 L82 2 C82 12 38 12 38 2 Z" fill="#161c22"/>
      <text x="60" y="72" text-anchor="middle" font-family="'Gasoek One',sans-serif" font-size="24" fill="#fff">RUN</text>
      <text x="60" y="98" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="17" fill="#f4692e" font-weight="700">4:2:1</text>
    </svg>
  </div>
  <div class="tee tee--2">
    <svg viewBox="0 0 120 140">
      <path d="M38 2 L20 10 L2 38 L24 52 L24 136 L96 136 L96 52 L118 38 L100 10 L82 2 C82 12 38 12 38 2 Z" fill="#fdfbf6"/>
      <path d="M60 56 L66 74 L85 74 L70 85 L76 104 L60 92 L44 104 L50 85 L35 74 L54 74 Z" fill="#f4692e"/>
      <text x="60" y="122" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="12" fill="#0e2a3c" font-weight="700" letter-spacing="3">GOAL</text>
    </svg>
  </div>
  <div class="tee tee--3">
    <svg viewBox="0 0 120 140">
      <path d="M38 2 L20 10 L2 38 L24 52 L24 136 L96 136 L96 52 L118 38 L100 10 L82 2 C82 12 38 12 38 2 Z" fill="#ffd866"/>
      <circle cx="60" cy="82" r="26" fill="none" stroke="#0e2a3c" stroke-width="7"/>
      <circle cx="60" cy="82" r="11" fill="#0e2a3c"/>
    </svg>
  </div>
  <div class="tee tee--4">
    <svg viewBox="0 0 120 140">
      <path d="M38 2 L20 10 L2 38 L24 52 L24 136 L96 136 L96 52 L118 38 L100 10 L82 2 C82 12 38 12 38 2 Z" fill="#f4692e"/>
      <text x="60" y="90" text-anchor="middle" font-family="'Gasoek One',sans-serif" font-size="38" fill="#fff">OK!</text>
    </svg>
  </div>
  <div class="tee tee--5">
    <svg viewBox="0 0 120 140">
      <path d="M38 2 L20 10 L2 38 L24 52 L24 136 L96 136 L96 52 L118 38 L100 10 L82 2 C82 12 38 12 38 2 Z" fill="#fdfbf6"/>
      <path d="M66 52 L46 86 L58 86 L52 112 L76 76 L62 76 Z" fill="#4fa6dd"/>
    </svg>
  </div>
</div>

<header class="nav">
  <a class="nav__brand" href="#">
    <span class="nav__chip glass">👕</span>
    <span class="nav__title">무신사 티 발견 검색</span>
  </a>
  <nav class="nav__links glass" aria-label="주요 메뉴">
    <a href="#">검색</a>
    <a href="#">브랜드</a>
    <a href="#">소개</a>
  </nav>
</header>

<main class="hero">
  <p class="hero__eyebrow">Graphic Tee Search</p>
  <h1 class="hero__title">눈에 보이는 그대로,<br /><em>말로 찾는</em> 그래픽 티</h1>

  <form class="search" role="search" onsubmit="return false">
    <span class="search__chip glass" aria-hidden="true">👕</span>
    <div class="search__pill glass">
      <input class="search__input" type="search" aria-label="티셔츠 검색"
             placeholder="검정 바탕에 흰 레터링 백프린트" />
      <button class="search__btn" type="submit">찾기</button>
    </div>
  </form>

  <div class="chips">
    <button class="chip glass" type="button"><b>검정 바탕</b>에 흰 레터링 백프린트</button>
    <button class="chip glass" type="button"><b>하늘색 티</b>, 가슴에 작은 오렌지 로고</button>
    <button class="chip glass" type="button">흰 티에 <b>파란 그래픽</b> 크게</button>
  </div>

  <p class="formula">
    <span class="glass">바탕색</span><i>×</i>
    <span class="glass">프린트색</span><i>×</i>
    <span class="glass">위치</span><i>=</i>
    <span class="glass" style="color: var(--butter); font-weight: 700">내 티셔츠</span>
  </p>
</main>

<script>
  // 플레이스홀더에 예시 질의가 번갈아 타이핑되는 데모
  const queries = [
    "검정 바탕에 흰 레터링 백프린트",
    "하늘색 티, 가슴에 작은 오렌지 로고",
    "흰 티에 파란 그래픽 크게",
    "노란 바탕, 등에 라운드 로고",
  ];
  const input = document.querySelector(".search__input");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduced) {
    let qi = 0, ci = 0, erasing = false;
    setInterval(() => {
      if (document.activeElement === input) return;
      const q = queries[qi];
      if (!erasing) {
        ci++;
        if (ci >= q.length + 14) erasing = true; // 다 친 뒤 잠깐 머무름
      } else {
        ci--;
        if (ci <= 0) { erasing = false; qi = (qi + 1) % queries.length; }
      }
      input.placeholder = q.slice(0, Math.min(ci, q.length));
    }, 70);
  }

  // 예시 칩 클릭 → 검색창에 채우기
  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      input.value = chip.textContent.trim();
      input.focus();
    });
  });
</script>
</body>
</html>
