<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>그래픽 티 발견 검색 — 상품 상세 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #0b0d10;
    --text: #f5f5f4;
    --muted: rgba(245, 245, 244, 0.55);
    --hairline: rgba(255, 255, 255, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    background:
      radial-gradient(50rem 34rem at 12% -6%, rgba(53, 110, 255, 0.45), transparent 62%),
      radial-gradient(44rem 30rem at 105% 22%, rgba(148, 70, 245, 0.38), transparent 62%),
      radial-gradient(40rem 28rem at 88% 108%, rgba(255, 110, 45, 0.32), transparent 62%),
      radial-gradient(36rem 26rem at -4% 90%, rgba(40, 200, 145, 0.26), transparent 62%),
      #0d0f13;
    background-attachment: fixed;
    color: var(--text);
    min-height: 100dvh;
  }

  /* ---------- 헤더 (결과 화면과 동일) ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 1.1rem;
    padding: 2rem clamp(1.5rem, 4vw, 3rem) 1.2rem;
  }
  .top__back {
    display: grid; place-items: center;
    width: 2.9rem; height: 2.9rem; border-radius: 50%;
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.5),
      inset 8px 0 12px -8px rgba(255, 255, 255, 0.35),
      inset -8px 0 12px -8px rgba(255, 255, 255, 0.35),
      0 10px 26px rgba(0, 0, 0, 0.35);
    transition: background 0.2s, transform 0.15s;
  }
  .top__back:hover, .top__back:focus-visible { background: rgba(255, 255, 255, 0.16); transform: translateX(-2px); }
  .top::before {
    content: ""; position: absolute; z-index: -1;
    inset: 0 0 -2.5rem;
    background: linear-gradient(180deg, rgba(11, 13, 16, 0.85), rgba(11, 13, 16, 0.35) 62%, transparent);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent);
    mask-image: linear-gradient(180deg, #000 55%, transparent);
    pointer-events: none;
  }
  .top__brand {
    text-decoration: none; color: var(--text);
    font-size: 0.95rem; font-weight: 800; letter-spacing: -0.02em;
    white-space: nowrap;
  }
  /* ---------- 본문 ---------- */
  .detail {
    display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
    gap: clamp(1.5rem, 4vw, 3.5rem);
    padding: 1.6rem clamp(1.5rem, 4vw, 3rem) 4rem;
    max-width: 78rem; margin: 0 auto;
  }

  /* 갤러리 */
  .gallery__main {
    overflow: hidden; border-radius: 20px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .gallery__main img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; }
  .gallery__thumbs { display: flex; gap: 0.7rem; margin-top: 0.9rem; }
  .gallery__thumbs button {
    flex: 1; padding: 0; border: 0; cursor: pointer; overflow: hidden; border-radius: 12px;
    background: none;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    opacity: 0.55; transition: opacity 0.2s, box-shadow 0.2s;
  }
  .gallery__thumbs button.is-active,
  .gallery__thumbs button:hover, .gallery__thumbs button:focus-visible { opacity: 1; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.55); }
  .gallery__thumbs img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; }

  /* 정보 패널 */
  .info { display: flex; flex-direction: column; gap: 1.6rem; min-width: 0; }
  .info > * { opacity: 0; translate: 0 12px; animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
  .info > :nth-child(1) { animation-delay: 0.05s; }
  .info > :nth-child(2) { animation-delay: 0.14s; }
  .info > :nth-child(3) { animation-delay: 0.22s; }
  .info > :nth-child(4) { animation-delay: 0.3s; }
  .info > :nth-child(5) { animation-delay: 0.38s; }
  .info > :nth-child(6) { animation-delay: 0.46s; }
  .info > :nth-child(7) { animation-delay: 0.54s; }
  @keyframes rise { to { opacity: 1; translate: 0 0; } }

  .head__brand { font-size: 0.85rem; color: var(--muted); }
  .head__title {
    margin-top: 0.3rem;
    font-size: clamp(1.4rem, 2.4vw, 1.9rem); font-weight: 800; letter-spacing: -0.02em;
    line-height: 1.3;
  }
  .head__sub { display: flex; align-items: baseline; gap: 0.9rem; margin-top: 0.7rem; }
  .head__price { font-size: 1.35rem; font-weight: 800; }
  .head__review { font-size: 0.85rem; color: var(--muted); }
  .head__review b { color: #ffd166; font-weight: 700; }

  .label {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  /* 검색 일치 속성 — 물방울 토큰 */
  .tokens { display: flex; flex-wrap: wrap; gap: 0.55rem; }
  .token {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border-radius: 999px; padding: 0.5rem 1.05rem;
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.5),
      inset 8px 0 12px -8px rgba(255, 255, 255, 0.35),
      inset -8px 0 12px -8px rgba(255, 255, 255, 0.35),
      0 10px 26px rgba(0, 0, 0, 0.35);
    font-size: 0.82rem; font-weight: 600;
    opacity: 0; transform: scale(0.25);
    animation: droplet 0.6s cubic-bezier(0.3, 1.65, 0.4, 1) forwards;
    animation-delay: calc(var(--i) * 0.09s + 0.25s);
  }
  .token i { font-style: normal; font-weight: 500; font-size: 0.78rem; color: var(--muted); }
  .token .swatch {
    width: 0.85rem; height: 0.85rem; border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  @keyframes droplet {
    0%   { opacity: 0; transform: scale(0.2); filter: blur(8px); }
    55%  { opacity: 1; transform: scale(1.1, 0.88); filter: blur(0); }
    75%  { transform: scale(0.95, 1.06); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  /* 색상 */
  .colors { display: flex; gap: 0.6rem; }
  .colors button {
    width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 0; cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.2);
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .colors button.is-active { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 0 0 2px #fff; }
  .colors button:hover { transform: translateY(-2px); }

  /* 사이즈 */
  .sizes { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .sizes button {
    min-width: 3.2rem; padding: 0.55rem 0.9rem;
    border: 0; border-radius: 999px; cursor: pointer;
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
    color: var(--muted);
    font: 600 0.85rem "Pretendard Variable", Pretendard, sans-serif;
    transition: color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .sizes button:hover { transform: translateY(-2px); color: var(--text); }
  .sizes button.is-active {
    color: var(--text);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 0 0 1.5px rgba(255, 255, 255, 0.6);
  }

  /* 리뷰 태그 */
  .tags { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .tags span {
    border-radius: 999px; padding: 0.4rem 0.85rem;
    border: 1px solid var(--hairline);
    font-size: 0.76rem; color: var(--muted);
  }

  /* CTA */
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    height: 4rem; border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: #101013; text-decoration: none;
    font-size: 1rem; font-weight: 800;
    box-shadow: inset 0 1px 0 #fff, 0 18px 44px rgba(0, 0, 0, 0.45);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 #fff, 0 24px 52px rgba(0, 0, 0, 0.55); }
  .cta svg { translate: 0 1px; }

  @media (prefers-reduced-motion: reduce) {
    .info > *, .token { animation: none; opacity: 1; transform: none; translate: 0 0; }
  }

  @media (max-width: 56rem) {
    .detail { grid-template-columns: 1fr; }
    .top { gap: 1rem; }
  }
  @media (max-width: 40rem) {
    .sizes button { padding: 0.8rem 1.1rem; min-width: 3.5rem; }
    .colors button { width: 2.75rem; height: 2.75rem; }
  }
</style>
</head>
<body>

<header class="top">
  <a class="top__back" href="2026-08-05-results.html" aria-label="검색 결과로 돌아가기">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M14.5 5 L7.5 12 L14.5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </a>
  <a class="top__brand" href="2026-08-04-home-final.html">티:파운드</a>
</header>

<!-- DB search_goods goods_no=2584839 실측 데이터 -->
<main class="detail">
  <section class="gallery" aria-label="상품 이미지">
    <div class="gallery__main">
      <img id="mainImg" src="https://image.msscdn.net/images/goods_img/20220526/2584839/2584839_17790681796826_500.jpg" alt="에이치덱스 메인 백로고 오버핏 반팔티" />
    </div>
    <div class="gallery__thumbs" id="thumbs"></div>
  </section>

  <section class="info">
    <div class="head">
      <div class="head__brand">에이치덱스</div>
      <h1 class="head__title">메인 백로고 오버핏 반팔티</h1>
      <div class="head__sub">
        <span class="head__price">48,000원</span>
        <span class="head__review"><b>★ 4.9</b> · 리뷰 877</span>
      </div>
    </div>

    <div>
      <div class="label">검색과 일치</div>
      <div class="tokens">
        <span class="token" style="--i:0"><span class="swatch" style="background:#17181c"></span><i>바탕색</i>블랙</span>
        <span class="token" style="--i:1"><span class="swatch" style="background:#f4f2ec"></span><i>프린트</i>화이트 로고</span>
        <span class="token" style="--i:2"><i>위치</i>백프린트</span>
      </div>
    </div>

    <div>
      <div class="label">속성</div>
      <div class="tokens">
        <span class="token" style="--i:3"><i>핏</i>오버핏</span>
        <span class="token" style="--i:4"><i>소재</i>면</span>
        <span class="token" style="--i:5"><i>카테고리</i>스포츠 반소매</span>
      </div>
    </div>

    <div>
      <div class="label">색상 · 블랙</div>
      <div class="colors" id="colors">
        <button class="is-active" style="background:#17181c" aria-label="블랙"></button>
        <button style="background:#f4f2ec" aria-label="화이트"></button>
        <button style="background:#b3372f" aria-label="레드"></button>
        <button style="background:#6b6f4a" aria-label="올리브 그린"></button>
      </div>
    </div>

    <div>
      <div class="label">사이즈</div>
      <div class="sizes" id="sizes"></div>
    </div>

    <div>
      <div class="label">리뷰 키워드</div>
      <div class="tags">
        <span>오버핏</span><span>선명한 발색</span><span>재질 좋음</span>
        <span>탄탄함</span><span>운동복</span><span>커플티</span>
      </div>
    </div>

    <a class="cta" href="https://www.musinsa.com/products/2584839" target="_blank" rel="noopener">
      무신사에서 보기
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 17 L17 7 M9 7 h8 v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </section>
</main>

<script>
  // 갤러리 (thumbnail + gallery 4장)
  const photos = [
    "https://image.msscdn.net/images/goods_img/20220526/2584839/2584839_17790681796826_500.jpg",
    "https://image.msscdn.net/images/prd_img/20220526/2584839/detail_2584839_17790681802653_500.jpg",
    "https://image.msscdn.net/images/prd_img/20220526/2584839/detail_2584839_17790681804117_500.jpg",
    "https://image.msscdn.net/images/prd_img/20220526/2584839/detail_2584839_17790681805595_500.jpg",
    "https://image.msscdn.net/images/prd_img/20220526/2584839/detail_2584839_17790681806911_500.jpg",
  ];
  const mainImg = document.getElementById("mainImg");
  const thumbs = document.getElementById("thumbs");
  photos.forEach((src, i) => {
    const b = document.createElement("button");
    b.type = "button";
    if (i === 0) b.className = "is-active";
    b.innerHTML = `<img src="${src}" alt="상품 이미지 ${i + 1}" loading="lazy" />`;
    b.addEventListener("click", () => {
      mainImg.src = src;
      thumbs.querySelectorAll("button").forEach((x) => x.classList.remove("is-active"));
      b.classList.add("is-active");
    });
    thumbs.appendChild(b);
  });

  // 사이즈 (size_std 병기)
  const sizes = [["M", 95], ["L", 100], ["XL", 105], ["2XL", 110], ["3XL", 115], ["4XL", 120]];
  const sizesEl = document.getElementById("sizes");
  sizes.forEach(([name], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    if (i === 1) b.className = "is-active";
    b.addEventListener("click", () => {
      sizesEl.querySelectorAll("button").forEach((x) => x.classList.remove("is-active"));
      b.classList.add("is-active");
    });
    sizesEl.appendChild(b);
  });

  // 색상 선택 → 라벨 갱신
  const colorNames = ["블랙", "화이트", "레드", "올리브 그린"];
  const colorsEl = document.getElementById("colors");
  const colorLabel = colorsEl.previousElementSibling;
  colorsEl.querySelectorAll("button").forEach((b, i) => {
    b.addEventListener("click", () => {
      colorsEl.querySelectorAll("button").forEach((x) => x.classList.remove("is-active"));
      b.classList.add("is-active");
      colorLabel.textContent = "색상 · " + colorNames[i];
    });
  });
</script>
</body>
</html>
