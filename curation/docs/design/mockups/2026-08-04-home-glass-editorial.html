<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>그래픽 티 발견 검색 — Glass Editorial 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --obsidian: #0b0d10;
    --porcelain: #f3efe7;
    --champagne: #c8a468;
    --hairline: rgba(255, 255, 255, 0.16);
    --glass: rgba(20, 23, 28, 0.42);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    background: var(--obsidian);
    color: var(--porcelain);
    min-height: 100dvh;
    overflow: hidden;
  }

  /* ---------- 상품 갤러리 월 ---------- */
  .wall {
    position: fixed; inset: -4rem 0; z-index: 0;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem; padding: 0 2rem;
  }
  .wall__col { overflow: hidden; }
  .wall__stack { display: flex; flex-direction: column; gap: 1.5rem; animation: scroll var(--speed, 70s) linear infinite; }
  .wall__col--rev .wall__stack { animation-direction: reverse; }
  @keyframes scroll { to { transform: translateY(-50%); } }

  .card { flex: none; }
  .card__img {
    width: 100%; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: 10px; display: block;
    filter: saturate(0.92) brightness(0.94);
  }
  .card__meta {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0.55rem 0.15rem 0;
    font-size: 0.68rem; letter-spacing: 0.02em; color: rgba(243, 239, 231, 0.6);
  }
  .card__meta b { font-weight: 600; color: rgba(243, 239, 231, 0.78); }

  .veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(62rem 36rem at 50% 56%, rgba(11, 13, 16, 0.95), rgba(11, 13, 16, 0.62) 62%, rgba(11, 13, 16, 0.3) 100%),
      linear-gradient(180deg, rgba(11, 13, 16, 0.85), transparent 22%, transparent 72%, rgba(11, 13, 16, 0.9));
  }

  /* ---------- 유리 공통 ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--hairline);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 20px 60px rgba(0, 0, 0, 0.45);
  }

  /* ---------- 네비 ---------- */
  .nav {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.75rem clamp(1.5rem, 4vw, 3.5rem);
  }
  .nav__brand {
    text-decoration: none; color: var(--porcelain);
    font-family: "Space Grotesk", sans-serif; font-size: 0.85rem;
    letter-spacing: 0.28em; text-transform: uppercase;
  }
  .nav__brand b { color: var(--champagne); font-weight: 500; }
  .nav__links { display: flex; gap: 0.25rem; border-radius: 999px; padding: 0.3rem; }
  .nav__links a {
    color: rgba(243, 239, 231, 0.85); text-decoration: none;
    font-size: 0.82rem; font-weight: 500; padding: 0.5rem 1.1rem;
    border-radius: 999px; transition: background 0.2s, color 0.2s;
  }
  .nav__links a:hover, .nav__links a:focus-visible { background: rgba(255, 255, 255, 0.1); color: #fff; }

  /* ---------- 히어로 ---------- */
  .hero {
    position: relative; z-index: 2;
    min-height: calc(100dvh - 6.5rem);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.25rem; padding: 0 1.5rem 5rem; text-align: center;
  }

  .hero__eyebrow {
    display: flex; align-items: center; gap: 1rem;
    font-family: "Space Grotesk", sans-serif;
    font-size: 0.72rem; letter-spacing: 0.42em; text-transform: uppercase;
    color: rgba(243, 239, 231, 0.66);
  }
  .hero__eyebrow::before, .hero__eyebrow::after {
    content: ""; width: 2.75rem; height: 1px; background: var(--champagne); opacity: 0.65;
  }

  .hero__title {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 5.2vw, 3.9rem);
    line-height: 1.32;
    letter-spacing: 0.005em;
  }
  .hero__title em {
    font-style: normal; color: var(--champagne);
  }

  .hero__sub {
    font-size: 0.95rem; font-weight: 400; line-height: 1.7;
    color: rgba(243, 239, 231, 0.62);
    margin-top: -0.9rem;
  }

  /* ---------- 검색 필 ---------- */
  .search { width: min(38rem, 92vw); }
  .search__pill {
    display: flex; align-items: center;
    height: 4.25rem; border-radius: 999px; padding: 0.5rem 0.5rem 0.5rem 1.9rem;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .search__pill:focus-within {
    border-color: rgba(200, 164, 104, 0.55);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 0 4px rgba(200, 164, 104, 0.12), 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .search__input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    color: var(--porcelain);
    font: 500 1.02rem/1 "Pretendard Variable", Pretendard, sans-serif;
    letter-spacing: -0.005em;
  }
  .search__input::placeholder { color: rgba(243, 239, 231, 0.45); }
  .search__btn {
    flex: none; height: 3.25rem; padding: 0 1.9rem; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #d9b87e, var(--champagne));
    color: #17130b; font: 700 0.95rem "Pretendard Variable", Pretendard, sans-serif;
    letter-spacing: 0.02em; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 10px 26px rgba(200, 164, 104, 0.28);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .search__btn:hover, .search__btn:focus-visible { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 14px 32px rgba(200, 164, 104, 0.38); }
  .search__btn:active { transform: translateY(0); }

  /* ---------- 예시 칩 ---------- */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; max-width: 42rem; }
  .chip {
    border-radius: 999px; padding: 0.62rem 1.25rem; cursor: pointer;
    color: rgba(243, 239, 231, 0.82);
    font: 500 0.84rem "Pretendard Variable", Pretendard, sans-serif;
    transition: transform 0.15s, border-color 0.2s, color 0.2s;
  }
  .chip:hover, .chip:focus-visible {
    transform: translateY(-2px); color: #fff;
    border-color: rgba(200, 164, 104, 0.5);
  }

  /* ---------- 하단 공식 ---------- */
  .formula {
    position: absolute; bottom: 2.25rem; left: 50%; translate: -50% 0;
    display: flex; align-items: center; gap: 0.9rem;
    font-family: "Space Grotesk", "Pretendard Variable", sans-serif;
    font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase;
    color: rgba(243, 239, 231, 0.5);
  }
  .formula i { font-style: normal; color: var(--champagne); opacity: 0.8; }

  /* ---------- 로드 시퀀스 ---------- */
  .hero > * { opacity: 0; translate: 0 16px; animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
  .hero > :nth-child(1) { animation-delay: 0.1s; }
  .hero > :nth-child(2) { animation-delay: 0.25s; }
  .hero > :nth-child(3) { animation-delay: 0.4s; }
  .hero > :nth-child(4) { animation-delay: 0.6s; }
  .hero > :nth-child(5) { animation-delay: 0.75s; }
  @keyframes rise { to { opacity: 1; translate: 0 0; } }
  .formula { opacity: 0; animation: fade 1s 1.1s forwards; }
  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .wall__stack, .hero > *, .formula { animation: none; opacity: 1; translate: 0 0; }
    .formula { translate: -50% 0; }
  }

  @media (max-width: 56rem) { .wall { grid-template-columns: repeat(3, 1fr); } .wall__col:nth-child(4) { display: none; } }
  @media (max-width: 40rem) {
    .wall { grid-template-columns: repeat(2, 1fr); gap: 1rem; padding: 0 1rem; }
    .wall__col:nth-child(3) { display: none; }
    .nav__links { display: none; }
    .search__pill { padding-left: 1.25rem; }
    .formula { width: 100%; justify-content: center; flex-wrap: wrap; letter-spacing: 0.14em; }
  }
</style>
</head>
<body>

<!-- 실제 상품 사진 갤러리 월 (DB search_goods 썸네일) -->
<div class="wall" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<header class="nav">
  <a class="nav__brand" href="#">Tee<b>:</b>Found — 무신사 발견 검색</a>
  <nav class="nav__links glass" aria-label="주요 메뉴">
    <a href="#">검색</a>
    <a href="#">브랜드</a>
    <a href="#">소개</a>
  </nav>
</header>

<main class="hero">
  <p class="hero__eyebrow">Curated Graphic Tees</p>
  <h1 class="hero__title">「검정 바탕, 흰 레터링」<br />말하는 <em>그대로</em> 찾아드립니다</h1>
  <p class="hero__sub">바탕색, 프린트 색, 프린트 위치 — 눈에 보이는 속성을 문장으로 검색하세요.</p>

  <form class="search" role="search" onsubmit="return false">
    <div class="search__pill glass">
      <input class="search__input" type="search" aria-label="티셔츠 검색"
             placeholder="검정 바탕에 흰 레터링 백프린트" />
      <button class="search__btn" type="submit">찾기</button>
    </div>
  </form>

  <div class="chips">
    <button class="chip glass" type="button">검정 바탕에 흰 레터링 백프린트</button>
    <button class="chip glass" type="button">네이비 럭비 저지, 가슴 로고</button>
    <button class="chip glass" type="button">아이보리 티에 아치 스크립트</button>
  </div>

  <p class="formula">바탕색 <i>×</i> 프린트색 <i>×</i> 위치 <i>=</i> 내 티셔츠</p>
</main>

<script>
  // DB(search_goods)에서 가져온 실제 상품 — 로고/그래픽 패턴, 리뷰순 상위
  const goods = [
    { brand: "에이치덱스", price: 35880, img: "https://image.msscdn.net/images/goods_img/20211110/2225772/2225772_17416566557348_500.jpg" },
    { brand: "카키그라도", price: 36000, img: "https://image.msscdn.net/images/goods_img/20230829/3509806/3509806_16932933104825_500.png" },
    { brand: "코닥", price: 53100, img: "https://image.msscdn.net/images/goods_img/20230406/3213283/3213283_17435573335224_500.jpg" },
    { brand: "코닥", price: 35100, img: "https://image.msscdn.net/images/goods_img/20240207/3852522/3852522_17398365622718_500.jpg" },
    { brand: "제이엘브", price: 30780, img: "https://image.msscdn.net/images/goods_img/20240805/4296100/4296100_17236147415206_500.jpg" },
    { brand: "드릭스", price: 25500, img: "https://image.msscdn.net/images/goods_img/20250420/5045549/5045549_17459121536079_500.jpg" },
    { brand: "바이젝", price: 36000, img: "https://image.msscdn.net/images/goods_img/20231016/3629645/3629645_17847033561665_500.jpg" },
    { brand: "토런스", price: 61000, img: "https://image.msscdn.net/images/goods_img/20240428/4092313/4092313_17642081736097_500.jpg" },
    { brand: "페이크캠퍼", price: 33910, img: "https://image.msscdn.net/images/goods_img/20230317/3156109/3156109_17331260267192_500.jpg" },
    { brand: "카키그라도", price: 36000, img: "https://image.msscdn.net/images/goods_img/20240327/3997076/3997076_17827212879793_500.jpg" },
    { brand: "프리덤", price: 51200, img: "https://image.msscdn.net/images/goods_img/20250204/4754406/4754406_17636949283847_500.jpg" },
    { brand: "클레버필드", price: 22820, img: "https://image.msscdn.net/images/goods_img/20230207/3064786/3064786_16784413180227_500.jpg" },
    { brand: "제이엘브", price: 32000, img: "https://image.msscdn.net/images/goods_img/20240408/4034896/4034896_17128012196414_500.jpg" },
    { brand: "드릭스", price: 29900, img: "https://image.msscdn.net/images/goods_img/20250526/5147122/5147122_17490902706784_500.jpg" },
    { brand: "에이치덱스", price: 48000, img: "https://image.msscdn.net/images/goods_img/20220526/2584839/2584839_17790681796826_500.jpg" },
  ];

  const wall = document.querySelector(".wall");
  const COLS = 4, SPEEDS = [72, 96, 80, 108];

  for (let c = 0; c < COLS; c++) {
    const col = document.createElement("div");
    col.className = "wall__col" + (c % 2 ? " wall__col--rev" : "");
    const stack = document.createElement("div");
    stack.className = "wall__stack";
    stack.style.setProperty("--speed", SPEEDS[c] + "s");
    const items = goods.filter((_, i) => i % COLS === c);
    // 끊김 없는 루프를 위해 두 번 반복
    [...items, ...items, ...items, ...items].forEach(({ brand, price, img }) => {
      const card = document.createElement("figure");
      card.className = "card";
      card.innerHTML = `
        <img class="card__img" src="${img}" alt="" loading="eager" />
        <figcaption class="card__meta"><b>${brand}</b><span>${price.toLocaleString()}원</span></figcaption>`;
      stack.appendChild(card);
    });
    col.appendChild(stack);
    wall.appendChild(col);
  }

  // 플레이스홀더 타이핑 데모
  const queries = [
    "검정 바탕에 흰 레터링 백프린트",
    "네이비 럭비 저지, 가슴에 로고",
    "아이보리 티에 아치 스크립트",
    "샌드 컬러, 등에 큰 그래픽",
  ];
  const input = document.querySelector(".search__input");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduced) {
    let qi = 0, ci = 0, erasing = false;
    setInterval(() => {
      if (document.activeElement === input) return;
      const q = queries[qi];
      if (!erasing) {
        ci++;
        if (ci >= q.length + 16) erasing = true;
      } else {
        ci--;
        if (ci <= 0) { erasing = false; qi = (qi + 1) % queries.length; }
      }
      input.placeholder = q.slice(0, Math.min(ci, q.length));
    }, 65);
  }

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      input.value = chip.textContent.trim();
      input.focus();
    });
  });
</script>
</body>
</html>
